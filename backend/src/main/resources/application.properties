# =============================================
# BuildMart AI — Main Application Config
# =============================================
spring.application.name=buildmart-backend
server.port=8080
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain

# =============================================
# DATABASE — MySQL (production default)
# To use H2 in-memory for local dev, see below
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buildmart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:buildmart123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.open-in-view=false

# =============================================
# H2 IN-MEMORY (Quick start — no MySQL needed)
# Uncomment the 6 lines below and comment the
# MySQL section above to use H2 instead
# =============================================
# spring.datasource.url=jdbc:h2:mem:buildmartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

# =============================================
# REDIS CACHE
# Comment all spring.data.redis.* lines and
# set spring.cache.type=simple to disable Redis
# =============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# =============================================
# JWT SECURITY
# =============================================
app.jwt.secret=${JWT_SECRET:BuildMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationMinimum512BitsRequired}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# =============================================
# EMAIL (Gmail SMTP)
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.email.from=${MAIL_FROM:noreply@buildmart.ai}

# =============================================
# FILE UPLOAD
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# =============================================
# AWS S3 (Optional — for file storage)
# =============================================
aws.s3.bucket-name=${AWS_S3_BUCKET:buildmart-uploads}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.access-key=${AWS_ACCESS_KEY:}
aws.s3.secret-key=${AWS_SECRET_KEY:}

# =============================================
# OPENAI API
# =============================================
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.max-tokens=1000

# =============================================
# RATE LIMITING
# =============================================
app.rate-limit.requests-per-minute=60
app.rate-limit.requests-per-hour=500
app.rate-limit.login-attempts=5

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# =============================================
# SWAGGER / OPENAPI
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# =============================================
# ACTUATOR (Health checks)
# =============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.app.name=BuildMart AI
management.info.app.version=1.0.0

# =============================================
# LOGGING
# =============================================
logging.level.com.buildmart=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{20} - %msg%n
logging.file.name=logs/buildmart.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
